<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1>Weather App</h1>
        
        <div class="search-container">
            <input type="text" id="city-input" placeholder="Ingresa una ciudad...">
            <button id="search-btn"><i class="fas fa-search"></i></button>
            <button id="location-btn"><i class="fas fa-location-arrow"></i></button>
        </div>
        
        <div class="unit-toggle">
            <button id="toggle-unit">Cambiar a °F</button>
        </div>
        
        <div class="weather-card">
            <div class="current-weather">
                <div class="weather-info">
                    <h2 id="city-name">Ciudad, País</h2>
                    <div class="temp-container">
                        <span id="temperature">--</span>
                        <span id="temp-unit">°C</span>
                    </div>
                    <div id="weather-description">Descripción</div>
                    <div class="details">
                        <div><i class="fas fa-tint"></i> <span id="humidity">--</span>%</div>
                        <div><i class="fas fa-wind"></i> <span id="wind-speed">--</span> km/h</div>
                    </div>
                </div>
                <div class="weather-icon" id="weather-icon-container">
                    <!-- Ícono se cargará aquí -->
                </div>
            </div>
            
            <div class="forecast">
                <h3>Pronóstico de 3 días</h3>
                <div class="forecast-days" id="forecast-container">
                    <!-- Pronóstico se cargará aquí -->
                </div>
            </div>
        </div>
        
        <div id="custom-alert"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
